<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PBR Cat Plaza — Next Gen Rendering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d1a17;
    --ink-soft: #5b544c;
    --panel: rgba(250, 247, 242, 0.82);
    --line: rgba(29, 26, 23, 0.16);
    --accent: #b5532c;
    --stage: #cfc8bd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f1ebe2;
      --ink-soft: #b9b0a3;
      --panel: rgba(24, 22, 20, 0.78);
      --line: rgba(241, 235, 226, 0.18);
      --accent: #f0a06c;
      --stage: #1b1917;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f1ebe2;
    --ink-soft: #b9b0a3;
    --panel: rgba(24, 22, 20, 0.78);
    --line: rgba(241, 235, 226, 0.18);
    --accent: #f0a06c;
    --stage: #1b1917;
  }
  html, body { height: 100%; margin: 0; background: var(--stage); }
  body {
    overflow: hidden;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#view.dragging-light { cursor: grabbing; }

  .panel {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    width: min(300px, calc(100vw - 24px)); box-sizing: border-box; padding: 12px 16px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 13px; line-height: 1.55;
  }
  .panel label { display: flex; justify-content: space-between; font-weight: 600; margin-top: 8px; }
  .panel label output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .panel input[type=range] { width: 100%; margin: 2px 0 0; accent-color: var(--accent); }
  .panel h3 { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
  .panel h3:first-child { margin: 0; padding: 0; border: 0; }
  .panel ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-soft); }
  .heading {
    position: fixed;
    left: calc(14px + env(safe-area-inset-left, 0px));
    top: calc(12px + env(safe-area-inset-top, 0px));
    font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
    padding: 6px 12px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    pointer-events: none;
  }
  .heading small { font-weight: 400; color: var(--ink-soft); margin-left: 8px; }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--stage); color: var(--ink); font-size: 15px; z-index: 10;
    transition: opacity 0.5s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .bar { width: 180px; height: 3px; background: var(--line); margin-top: 12px; border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }

  /* keep dat.GUI clear of the status bar */
  .dg.ac { top: env(safe-area-inset-top, 0px) !important; right: env(safe-area-inset-right, 0px) !important; z-index: 5 !important; }
  .dg { font-family: "IBM Plex Sans Thai", system-ui, sans-serif !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="heading">PBR Cat Plaza<small>Three.js</small></div>

<div class="panel">
  <h3>ตำแหน่งแสง</h3>
  <label>Light X <output id="oX"></output></label><input type="range" id="sX" min="-12" max="12" step="0.1">
  <label>Light Y <output id="oY"></output></label><input type="range" id="sY" min="0.5" max="12" step="0.1">
  <label>Light Z <output id="oZ"></output></label><input type="range" id="sZ" min="-12" max="12" step="0.1">
  <h3>วัสดุแมว (PBR)</h3>
  <label>Metallic <output id="oM"></output></label><input type="range" id="sM" min="0" max="1" step="0.01">
  <label>Roughness <output id="oR"></output></label><input type="range" id="sR" min="0" max="1" step="0.01">
  <h3>วิธีควบคุม</h3>
  <ul>
    <li>เมาส์: ลากลูกแสงสีเหลืองเพื่อย้ายไฟ</li>
    <li>ลากพื้นที่ว่างเพื่อหมุนกล้อง · Scroll ซูม</li>
    <li>ดับเบิลคลิกที่พื้นเพื่อวางไฟตรงนั้น</li>
    <li>คีย์บอร์ด: WASD ขยับไฟ · Q/E ลง/ขึ้น</li>
  </ul>
</div>

<div id="loading"><div>กำลังโหลดฉาก…<div class="bar"><i></i></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ---------- external asset files (same folder as index.html) ---------- */
const GLB_URL = 'cat.glb';
const EXR_URL = 'rathaus_1k.exr';

/* ---------- renderer / scene / camera ---------- */
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15130f);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 400);
const CAM_HOME = new THREE.Vector3(0, 4.6, 14.5);
const TARGET_HOME = new THREE.Vector3(0, 1.5, 0.8);
camera.position.copy(CAM_HOME);

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(TARGET_HOME);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI * 0.495;   // keep camera above the floor
controls.update();

const maxAniso = renderer.capabilities.getMaxAnisotropy();

const allPBR = [];
function registerPBR(mat) { allPBR.push(mat); return mat; }

/* ---------- procedural PBR texture helpers ---------- */
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

function heightToNormalCanvas(heightCanvas, strength) {
  const w = heightCanvas.width, h = heightCanvas.height;
  const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  const out = makeCanvas(w);
  const octx = out.getContext('2d');
  const img = octx.createImageData(w, h);
  const H = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const nx = (H(x - 1, y) - H(x + 1, y)) * strength;
      const ny = (H(x, y + 1) - H(x, y - 1)) * strength;
      const len = Math.sqrt(nx * nx + ny * ny + 1);
      const i = (y * w + x) * 4;
      img.data[i]     = ((nx / len) * 0.5 + 0.5) * 255;
      img.data[i + 1] = ((ny / len) * 0.5 + 0.5) * 255;
      img.data[i + 2] = ((1 / len) * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  return out;
}

function toTexture(c, srgb, repeatX, repeatY) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  if (repeatX) t.repeat.set(repeatX, repeatY || repeatX);
  return t;
}

// seeded random so the look is stable between visits
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function speckle(ctx, size, count, rMin, rMax, alpha, light, rgb) {
  for (let i = 0; i < count; i++) {
    const x = rnd() * size, y = rnd() * size, r = rMin + rnd() * (rMax - rMin);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const v = light ? 255 : 0;
    const c = rgb || `${v},${v},${v}`;
    g.addColorStop(0, `rgba(${c},${alpha})`);
    g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

/* Floor: polished stone tiles — smooth tile, rough grout, normal-mapped joints */
function buildFloorMaterial() {
  const S = 512, tiles = 2, T = S / tiles, groove = 5;
  const color = makeCanvas(S), rough = makeCanvas(S), height = makeCanvas(S);
  const cc = color.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');

  cc.fillStyle = '#1c1a18'; cc.fillRect(0, 0, S, S);
  rc.fillStyle = 'rgb(0,225,0)'; rc.fillRect(0, 0, S, S);     // grout: roughness ~0.88, metal 0
  hc.fillStyle = '#000'; hc.fillRect(0, 0, S, S);

  for (let ty = 0; ty < tiles; ty++) {
    for (let tx = 0; tx < tiles; tx++) {
      const light = (tx + ty) % 2 === 0;
      const x = tx * T + groove / 2, y = ty * T + groove / 2, w = T - groove, h = T - groove;
      cc.fillStyle = light ? '#cfc8bb' : '#5b5e63'; cc.fillRect(x, y, w, h);
      rc.fillStyle = light ? 'rgb(0,100,0)' : 'rgb(0,44,0)'; rc.fillRect(x, y, w, h);  // light ≈0.37, dark ≈0.13
      hc.fillStyle = '#fff'; hc.fillRect(x, y, w, h);
    }
  }
  // stone veining + smudges (variation in color and roughness)
  for (let i = 0; i < 26; i++) {
    cc.strokeStyle = `rgba(${rnd() > 0.5 ? '255,255,255' : '0,0,0'},0.07)`;
    cc.lineWidth = 1 + rnd() * 2;
    cc.beginPath();
    const x0 = rnd() * S, y0 = rnd() * S;
    cc.moveTo(x0, y0);
    cc.bezierCurveTo(x0 + rnd() * 120 - 60, y0 + rnd() * 120 - 60, x0 + rnd() * 160 - 80, y0 + rnd() * 160 - 80, x0 + rnd() * 200 - 100, y0 + rnd() * 200 - 100);
    cc.stroke();
  }
  speckle(cc, S, 90, 14, 46, 0.06, true);
  speckle(cc, S, 90, 14, 46, 0.06, false);
  rc.globalCompositeOperation = 'lighter';
  speckle(rc, S, 70, 10, 40, 0.10, true, '0,255,0');
  rc.globalCompositeOperation = 'source-over';

  const rep = 40;
  const mat = new THREE.MeshStandardMaterial({
    map: toTexture(color, true, rep),
    roughnessMap: toTexture(rough, false, rep),
    metalnessMap: toTexture(rough, false, rep),    // B channel = 0 → dielectric
    normalMap: toTexture(heightToNormalCanvas(height, 3.0), false, rep),
    roughness: 1.0,
    metalness: 1.0,                                // multiplied by the B channel (0)
    envMapIntensity: 1.0
  });
  mat.normalScale.set(1, 1);
  return registerPBR(mat);
}

/* Window grid used by the glass-and-steel towers: G = roughness, B = metalness */
function buildCurtainWallMaterials(cols, rows, tint) {
  const S = 256;
  const color = makeCanvas(S), orm = makeCanvas(S);
  const cc = color.getContext('2d'), oc = orm.getContext('2d');
  cc.fillStyle = '#7d8790'; cc.fillRect(0, 0, S, S);
  oc.fillStyle = 'rgb(0,128,255)'; oc.fillRect(0, 0, S, S);                    // frame: brushed aluminium
  const cw = S / 4, ch = S / 4, m = 5;
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const g = cc.createLinearGradient(x * cw, y * ch, x * cw + cw, y * ch + ch);
    g.addColorStop(0, tint[0]); g.addColorStop(1, tint[1]);
    cc.fillStyle = g; cc.fillRect(x * cw + m, y * ch + m, cw - 2 * m, ch - 2 * m);
    oc.fillStyle = 'rgb(0,22,90)';                                           // glass: very smooth, low metal
    oc.fillRect(x * cw + m, y * ch + m, cw - 2 * m, ch - 2 * m);
  }
  return { color, orm, cols: cols / 4, rows: rows / 4 };
}

function curtainWall(w, h, d, tint) {
  const cols = Math.round(w / 0.9 / 4) * 4 || 4;
  const rows = Math.round(h / 0.9 / 4) * 4 || 4;
  const side = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 1, envMapIntensity: 1.2 });
  const p = buildCurtainWallMaterials(cols, rows, tint);
  side.map = toTexture(p.color, true, p.cols, p.rows);
  side.roughnessMap = toTexture(p.orm, false, p.cols, p.rows);
  side.metalnessMap = side.roughnessMap;
  registerPBR(side);
  return side;
}

function brickMaterial() {
  const S = 512, bw = 64, bh = 32, gap = 4;
  const color = makeCanvas(S), height = makeCanvas(S), rough = makeCanvas(S);
  const cc = color.getContext('2d'), hc = height.getContext('2d'), rc = rough.getContext('2d');
  cc.fillStyle = '#b9b0a2'; cc.fillRect(0, 0, S, S);
  hc.fillStyle = '#000'; hc.fillRect(0, 0, S, S);
  rc.fillStyle = 'rgb(0,250,0)'; rc.fillRect(0, 0, S, S);
  for (let row = 0; row < S / bh; row++) {
    const off = row % 2 ? bw / 2 : 0;
    for (let col = -1; col < S / bw + 1; col++) {
      const x = col * bw + off + gap / 2, y = row * bh + gap / 2;
      const v = 0.75 + rnd() * 0.25;
      cc.fillStyle = `rgb(${Math.round(150 * v)},${Math.round(62 * v)},${Math.round(44 * v)})`;
      cc.fillRect(x, y, bw - gap, bh - gap);
      hc.fillStyle = '#fff';
      hc.fillRect(x, y, bw - gap, bh - gap);
      rc.fillStyle = `rgb(0,${200 + (rnd() * 40 | 0)},0)`;
      rc.fillRect(x, y, bw - gap, bh - gap);
    }
  }
  speckle(cc, S, 80, 8, 30, 0.08, false);
  const mat = new THREE.MeshStandardMaterial({
    map: toTexture(color, true, 2, 3),
    roughnessMap: toTexture(rough, false, 2, 3),
    normalMap: toTexture(heightToNormalCanvas(height, 4.0), false, 2, 3),
    roughness: 1.0, metalness: 0.0
  });
  return registerPBR(mat);
}

function concreteMaterial(base, repeat) {
  const S = 256;
  const color = makeCanvas(S), rough = makeCanvas(S), height = makeCanvas(S);
  const cc = color.getContext('2d'), rc = rough.getContext('2d'), hc = height.getContext('2d');
  cc.fillStyle = base; cc.fillRect(0, 0, S, S);
  rc.fillStyle = 'rgb(0,235,0)'; rc.fillRect(0, 0, S, S);
  hc.fillStyle = '#808080'; hc.fillRect(0, 0, S, S);
  speckle(cc, S, 120, 6, 28, 0.08, true); speckle(cc, S, 120, 6, 28, 0.08, false);
  speckle(hc, S, 220, 2, 9, 0.35, true); speckle(hc, S, 220, 2, 9, 0.35, false);
  const mat = new THREE.MeshStandardMaterial({
    map: toTexture(color, true, repeat, repeat),
    roughnessMap: toTexture(rough, false, repeat, repeat),
    normalMap: toTexture(heightToNormalCanvas(hc.canvas, 2.5), false, repeat, repeat),
    roughness: 1.0, metalness: 0.0
  });
  return registerPBR(mat);
}

function plainPBR(hex, metalness, roughness) {
  return registerPBR(new THREE.MeshStandardMaterial({
    color: new THREE.Color(hex).convertSRGBToLinear(), metalness, roughness
  }));
}

/* ---------- environment (HDRI) ---------- */
let envMap = null;
const params = { lx: -3.6, ly: 4.6, lz: 3.6, lightIntensity: 1.6 };

function setEnvIntensity(v) {
  allPBR.forEach(m => { m.envMapIntensity = v; });
}

function loadEnvironment() {
  return new Promise((resolve, reject) => {
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    new THREE.EXRLoader().setDataType(THREE.HalfFloatType).load(EXR_URL, (tex) => {
      envMap = pmrem.fromEquirectangular(tex).texture;
      scene.environment = envMap;
      scene.background = envMap;
      tex.dispose();
      pmrem.dispose();
      resolve();
    }, undefined, reject);
  });
}

/* ---------- floor, pedestal, display tiers ---------- */
const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 96), buildFloorMaterial());
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const floorMesh = floor;

const castersAndReceivers = [];
function addSolid(mesh, cast = true, receive = true) {
  mesh.castShadow = cast; mesh.receiveShadow = receive;
  scene.add(mesh);
  castersAndReceivers.push(mesh);
  return mesh;
}

// pedestal: white marble disc + brass ring (dielectric next to metal)
const PEDESTAL_H = 0.45;
addSolid(new THREE.Mesh(new THREE.CylinderGeometry(1.45, 1.55, PEDESTAL_H, 64), plainPBR('#d9dcdf', 1.0, 0.16))).position.y = PEDESTAL_H / 2;
const ring = addSolid(new THREE.Mesh(new THREE.TorusGeometry(1.47, 0.045, 16, 96), plainPBR('#d8a24a', 1.0, 0.18)), true, false);
ring.rotation.x = Math.PI / 2; ring.position.y = PEDESTAL_H;

/* ---------- buildings (two) ---------- */
const topCap = concreteMaterial('#8d8a85', 2);
function addTower(w, h, d, x, z, sideMat) {
  const mats = [sideMat, sideMat, topCap, topCap, sideMat, sideMat];
  const m = addSolid(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats));
  m.position.set(x, h / 2, z);
  return m;
}
addTower(3.2, 11, 3.2, -7.5, -7, curtainWall(3.2, 11, 3.2, ['#16283a', '#3a5f82']));   // glass tower
addTower(5.2, 5.2, 4.2, 6.5, -8, brickMaterial());                                      // brick hall

/* ---------- the cat ---------- */
const catRoot = new THREE.Group();
scene.add(catRoot);
const catMats = {};          // by glTF material name
const catOriginal = {};      // original values for reset
let catLoaded = false;

function loadCat() {
  return new Promise((resolve, reject) => {
    new THREE.GLTFLoader().load(GLB_URL, (gltf) => {
      const cat = gltf.scene;
      cat.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        const m = o.material;
        m.side = THREE.DoubleSide;
        if (!catMats[m.name]) {
          catMats[m.name] = m;
          catOriginal[m.name] = { color: m.color.clone(), metalness: m.metalness, roughness: m.roughness };
          registerPBR(m);
        }
      });
      // fit: ~2 units tall, feet on the pedestal
      const box = new THREE.Box3().setFromObject(cat);
      const size = box.getSize(new THREE.Vector3());
      const s = 2.7 / size.y;
      cat.scale.multiplyScalar(s);
      box.setFromObject(cat);
      const c = box.getCenter(new THREE.Vector3());
      cat.position.x -= c.x;
      cat.position.z -= c.z;
      cat.position.y -= box.min.y;
      cat.position.y += PEDESTAL_H;
      catRoot.add(cat);
      catLoaded = true;
      resolve();
    }, undefined, reject);
  });
}

/* ---------- light + draggable marker ---------- */
const light = new THREE.PointLight(0xfff1d6, params.lightIntensity, 0, 1);
light.position.set(params.lx, params.ly, params.lz);
light.castShadow = true;
light.shadow.mapSize.set(1024, 1024);
light.shadow.camera.near = 0.3;
light.shadow.camera.far = 60;
light.shadow.bias = -0.0006;
light.shadow.normalBias = 0.03;
scene.add(light);

const marker = new THREE.Group();
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe08a, toneMapped: false }));
marker.add(bulb);
const glowCanvas = makeCanvas(128);
{
  const g = glowCanvas.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,224,138,0.85)');
  gr.addColorStop(0.35, 'rgba(255,200,100,0.25)');
  gr.addColorStop(1, 'rgba(255,200,100,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(glowCanvas), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false
}));
glow.scale.set(1.5, 1.5, 1);
marker.add(glow);
const hit = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 8), new THREE.MeshBasicMaterial({ visible: false }));
marker.add(hit);
scene.add(marker);
marker.position.copy(light.position);

function setLightPosition(v) {
  v.y = Math.max(0.4, Math.min(v.y, 14));
  const r = Math.hypot(v.x, v.z);
  if (r > 18) { v.x *= 18 / r; v.z *= 18 / r; }
  light.position.copy(v);
  marker.position.copy(v);
  params.lx = +v.x.toFixed(2); params.ly = +v.y.toFixed(2); params.lz = +v.z.toFixed(2);
}

/* mouse / touch interaction */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const hitPoint = new THREE.Vector3();
let draggingLight = false;
let dragOffset = new THREE.Vector3();

function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
}

function overMarker(clientX, clientY) {
  setPointer({ clientX, clientY });
  return marker.visible && raycaster.intersectObject(hit).length > 0;
}
canvas.addEventListener('pointerdown', (e) => {
  if (!overMarker(e.clientX, e.clientY)) return;
  e.stopImmediatePropagation();               // keep OrbitControls out of this drag
  draggingLight = true;
  canvas.classList.add('dragging-light');
  canvas.setPointerCapture(e.pointerId);
  const camDir = camera.getWorldDirection(new THREE.Vector3());
  dragPlane.setFromNormalAndCoplanarPoint(camDir, marker.position);
  raycaster.ray.intersectPlane(dragPlane, hitPoint);
  dragOffset.copy(marker.position).sub(hitPoint);
  e.preventDefault();
}, true);
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1 && overMarker(e.touches[0].clientX, e.touches[0].clientY)) e.stopImmediatePropagation();
}, { capture: true, passive: true });
canvas.addEventListener('pointermove', (e) => {
  setPointer(e);
  if (draggingLight) {
    if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) { setLightPosition(hitPoint.clone().add(dragOffset)); syncLightUI(); }
  } else if (marker.visible) {
    canvas.style.cursor = raycaster.intersectObject(hit).length ? 'grab' : '';
  }
});
function endDrag(e) {
  if (!draggingLight) return;
  draggingLight = false;
  canvas.classList.remove('dragging-light');
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// double-click anywhere on the floor: drop the light 2.2 units above that point
canvas.addEventListener('dblclick', (e) => {
  setPointer(e);
  const h = raycaster.intersectObject(floorMesh)[0];
  if (h) { setLightPosition(new THREE.Vector3(h.point.x, 2.2, h.point.z)); syncLightUI(); }
});

/* ---------- UI (sliders + keyboard) ---------- */
const $ = (id) => document.getElementById(id);
const bodyMats = () => ['cat_brown', 'cat_white'].map(n => catMats[n]).filter(Boolean);
function syncLightUI() {
  [['X', 'lx'], ['Y', 'ly'], ['Z', 'lz']].forEach(([k, p]) => { $('s' + k).value = params[p]; $('o' + k).textContent = (+params[p]).toFixed(1); });
}
['X', 'Y', 'Z'].forEach(k => $('s' + k).addEventListener('input', () => {
  params.orbit = false;
  setLightPosition(new THREE.Vector3(+$('sX').value, +$('sY').value, +$('sZ').value));
  syncLightUI();
}));
function bindMat(id, outId, prop) {
  $(id).addEventListener('input', () => {
    const v = +$(id).value; $(outId).textContent = v.toFixed(2);
    bodyMats().forEach(m => { m[prop] = v; });
  });
}
bindMat('sM', 'oM', 'metalness');
bindMat('sR', 'oR', 'roughness');
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
function keyMove(dt) {
  const v = light.position.clone(), s = 5 * dt;
  if (keys['a']) v.x -= s; if (keys['d']) v.x += s;
  if (keys['w']) v.z -= s; if (keys['s']) v.z += s;
  if (keys['q']) v.y -= s; if (keys['e']) v.y += s;
  if (!v.equals(light.position)) { setLightPosition(v); syncLightUI(); }
}
function updateBackground() {}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  keyMove(dt);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- boot ---------- */
(async function boot() {
  try {
    await loadEnvironment();
  } catch (err) {
    console.error('HDRI failed to load (check rathaus_1k.exr is next to index.html)', err);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
  }
  try { await loadCat(); } catch (err) { console.error('Cat model failed to load', err); }
  setEnvIntensity(1.0);
  const t = bodyMats()[0];
  if (t) { $('sM').value = t.metalness; $('sR').value = t.roughness; $('oM').textContent = t.metalness.toFixed(2); $('oR').textContent = t.roughness.toFixed(2); }
  syncLightUI();
  animate();
  document.getElementById('loading').classList.add('done');
})();
</script>
</body>
